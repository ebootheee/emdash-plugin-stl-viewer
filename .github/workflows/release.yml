name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish in --dry-run mode"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Setup-node's `registry-url` writes _authToken=${NODE_AUTH_TOKEN} into
      # .npmrc and the literal placeholder breaks the OIDC fallback. Configure
      # the registry manually instead — npm 11.5+ then exchanges an OIDC token
      # for a publish token automatically.
      - name: Configure npm registry (no auth token — OIDC handles auth)
        run: echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm with provenance
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
